name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options: [production, staging]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "20"

jobs:
  # ─── Build & Push Docker Image ───────────────────────────────────────
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_SHA=${{ github.sha }}

  # ─── Deploy ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ vars.APP_URL }}

    steps:
      - uses: actions/checkout@v4

      # Option A: Deploy to a VPS/server via SSH
      # Uncomment and configure if using SSH-based deployment
      #
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
      #     script: |
      #       docker pull ${{ needs.build-and-push.outputs.image-tag }}
      #       docker stop claude-code-demo || true
      #       docker rm claude-code-demo || true
      #       docker run -d \
      #         --name claude-code-demo \
      #         --restart unless-stopped \
      #         -p 3001:3001 \
      #         -e NODE_ENV=production \
      #         -e PORT=3001 \
      #         ${{ needs.build-and-push.outputs.image-tag }}

      # Option B: Deploy to Railway
      # - name: Deploy to Railway
      #   uses: bervproject/railway-deploy@v1.0.6
      #   with:
      #     railway-token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: claude-code-demo

      # Option C: Deploy to Render
      # - name: Trigger Render deploy
      #   run: |
      #     curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # Default: log deployment info (replace with your provider above)
      - name: Log deployment info
        run: |
          echo "🚀 Deploying image: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "📦 Digest: ${{ needs.build-and-push.outputs.image-digest }}"
          echo "🌍 Environment: ${{ github.event.inputs.environment || 'production' }}"
          echo ""
          echo "Configure your deployment target in .github/workflows/deploy.yml"
          echo "See README.md for deployment options."

  # ─── Post-deployment smoke test ──────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy]
    if: vars.APP_URL != ''

    steps:
      - name: Health check
        run: |
          echo "Waiting 30s for deployment to settle..."
          sleep 30

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.APP_URL }}/health")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "✅ Health check passed: HTTP $STATUS"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Smoke test failed for ${{ vars.APP_URL }}"
          # Add Slack/email notification here
